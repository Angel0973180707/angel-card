<!-- 在 <head> 內替換原本的 PWA 段落 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#88b04b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="幸福教養">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('PWA: SW 註冊成功'))
        .catch(err => console.log('PWA: SW 註冊失敗', err));
    });
  }

  // 診斷：如果是 Android Chrome，這會觸發
  window.addEventListener('beforeinstallprompt', (e) => {
    // 防止 Android 自動彈出，改為在主畫面按鈕觸發（如果需要的話）
    console.log('PWA: 安裝提示已就緒');
  });
</script>
