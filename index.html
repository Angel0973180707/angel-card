<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天使笑長數位分身 | 幸福教養概念館</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --primary-green: #88b04b; /* 蘋果綠 */
            --soft-pink: #fff0f3;      /* 淺粉紅背景 */
            --border-pink: #ffd1dc;    /* 淺粉紅邊框 */
            --text-pink: #d63384;      /* 粉紅文字色 */
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #f9fbf7;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            color: #334155;
            -webkit-tap-highlight-color: transparent;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(136, 176, 75, 0.15);
            position: relative;
            margin: 20px 10px;
            display: flex;
            flex-direction: column;
            overflow: visible; 
        }

        .header-bg {
            background: linear-gradient(135deg, #88b04b 0%, #c5e1a5 100%);
            height: 180px;
            position: relative;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
        }

        .header-decoration {
            position: absolute;
            bottom: -35px;
            left: -10%;
            width: 120%;
            height: 80px;
            background: white;
            border-radius: 50%;
        }

        .avatar-wrapper {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .avatar-circle {
            width: 135px;
            height: 135px;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 12px 30px rgba(136, 176, 75, 0.2);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #f1f5f9;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 標籤樣式 */
        .tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            margin: 3px;
            font-weight: 500;
            white-space: nowrap; 
            background: var(--soft-pink);
            color: var(--text-pink);
            border: 1px solid var(--border-pink);
        }

        /* 功能按鈕框 - 粉紅風格 */
        .entry-card {
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-bottom: 16px;
            background: var(--soft-pink);
            border: 1px solid var(--border-pink);
            box-shadow: 0 4px 12px rgba(255, 192, 203, 0.1);
        }
        .entry-card:active { transform: scale(0.96); }

        /* 素養目標方塊 */
        .target-card {
            background: var(--soft-pink);
            border-radius: 20px;
            padding: 15px 5px;
            border: 1px solid var(--border-pink);
            box-shadow: 0 4px 10px rgba(255, 192, 203, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* QR Code 展示區佈局 */
        .qr-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 25px;
            padding: 15px 10px;
            background: #fdf2f4;
            border-radius: 25px;
            border: 1px dashed var(--border-pink);
        }

        .footer-banner {
            background: linear-gradient(to right, transparent, var(--soft-pink), transparent);
            padding: 25px 15px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            text-align: center;
            border-top: 1px solid #f1f5f9;
        }

        .main-title {
            font-size: 1.5rem; 
            font-weight: 800;
            color: #1e293b;
            letter-spacing: 0.1em;
            white-space: nowrap; 
        }
    </style>
</head>
<body>
